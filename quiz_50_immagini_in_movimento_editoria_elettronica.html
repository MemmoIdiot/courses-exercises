<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Quiz - Immagini in movimento</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18202a;--muted:#667085;--accent:#355c4a;--soft:#eaf1ed;--ok:#18794e;--okbg:#e9f7ef;--bad:#b42318;--badbg:#fff0ee;--line:#d9dee5}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#253c33,#456e5c);color:#fff;padding:34px 20px}.wrap,main{width:min(1000px,calc(100% - 28px));margin:auto}
h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.6rem)}header p{margin:0;opacity:.9}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tools{width:min(1000px,calc(100% - 28px));margin:auto;padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progressbox{flex:1 1 280px}.plabel{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:5px}
.track{height:9px;background:#dfe5e2;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}
main{padding:24px 0 60px}.card,.result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 26px rgba(20,30,25,.06)}
.qn{font-size:.8rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}.question{font-size:1.08rem;font-weight:750;margin:6px 0 14px}
.options{display:grid;gap:9px}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer}.option:hover{background:#fafcfb}.option.selected{background:var(--soft);border-color:#8ca698}.option.correct{background:var(--okbg);border-color:#70b28b}.option.incorrect{background:var(--badbg);border-color:#e59a93}.option input{margin-top:4px}
.check{margin-top:12px;background:#edf1f4}.feedback{display:none;margin-top:12px;padding:11px 13px;border-radius:10px}.feedback.show{display:block}.feedback.ok{background:var(--okbg);color:#115c3c}.feedback.bad{background:var(--badbg);color:#8f1d15}
.result{display:none}.result.show{display:block}.score{font-size:2rem;font-weight:900;color:var(--accent)}.muted{color:var(--muted);font-size:.92rem}
footer{text-align:center;color:var(--muted);padding:0 20px 35px}@media(max-width:600px){.card{padding:16px}.tools button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Immagini in movimento</h1><p>50 quiz su animazioni e video nell’editoria elettronica.</p></div></header>
<div class="topbar"><div class="tools">
<div class="progressbox"><div class="plabel"><span>Completamento</span><span id="pt">0 / 50</span></div><div class="track"><div class="bar" id="pb"></div></div></div>
<button class="primary" id="all">Valida tutto</button><button class="secondary" id="reset">Ricomincia</button>
</div></div>
<main>
<div class="result" id="result"><div class="muted">Risultato finale</div><div class="score" id="score">0 / 50</div><div id="comment"></div></div>
<div id="quiz"></div>
</main>
<footer>Quiz didattico — Editoria elettronica</footer>
<script>
const questions=[{"q": "Qual è la caratteristica che distingue concettualmente un’immagine in movimento da un’immagine statica?", "opts": ["L’introduzione della dimensione temporale", "L’uso obbligatorio del colore", "La presenza necessaria dell’audio", "La compressione con perdita"], "ans": 0, "exp": "Un’immagine in movimento dipende anche dal tempo: I(x,y,t)."}, {"q": "Che cosa indica il frame rate di un video?", "opts": ["Il numero di pixel per fotogramma", "Il numero di fotogrammi visualizzati o acquisiti ogni secondo", "La profondità colore", "Il rapporto d’aspetto"], "ans": 1, "exp": "Il frame rate si misura in fps, frames per second."}, {"q": "In un’animazione digitale, che cos’è un keyframe?", "opts": ["Un fotogramma sempre non compresso", "L’ultimo fotogramma della sequenza", "Un fotogramma che definisce uno stato significativo dell’oggetto", "Un fotogramma contenente solo trasparenza"], "ans": 2, "exp": "Il keyframe fissa proprietà significative come posizione, scala, rotazione o opacità."}, {"q": "Che cosa si intende per tweening o inbetweening?", "opts": ["La sincronizzazione automatica dell’audio", "La conversione da raster a vettoriale", "La riduzione della risoluzione video", "La generazione degli stati intermedi fra keyframe"], "ans": 3, "exp": "Il tweening genera automaticamente gli stati intermedi tra keyframe."}, {"q": "Che cosa descrive l’easing in un’animazione?", "opts": ["La variazione della velocità della transizione nel tempo", "La quantità di colori disponibili", "Il numero di tracce audio", "Il metodo di sottocampionamento cromatico"], "ans": 0, "exp": "L’easing controlla l’andamento temporale del movimento, per esempio accelerazione e decelerazione."}, {"q": "Qual è un vantaggio tipico dell’animazione vettoriale?", "opts": ["Richiede sempre più memoria di un video", "È scalabile senza perdita di qualità geometrica", "Può contenere solo bianco e nero", "Non può essere interattiva"], "ans": 1, "exp": "Le forme vettoriali sono definite matematicamente e non dipendono da una griglia fissa di pixel."}, {"q": "Quale tecnologia è particolarmente adatta alla grafica vettoriale animata sul Web?", "opts": ["TIFF", "WAV", "SVG", "CSV"], "ans": 2, "exp": "SVG descrive forme vettoriali e può essere animato tramite CSS o JavaScript."}, {"q": "Qual è un limite classico del formato GIF per le animazioni?", "opts": ["Non può contenere più di un fotogramma", "Non supporta alcuna compressione", "Richiede obbligatoriamente H.264", "La palette tradizionale è limitata a 256 colori"], "ans": 3, "exp": "La GIF usa tipicamente palette fino a 256 colori."}, {"q": "Che cosa caratterizza un’animazione procedurale?", "opts": ["Il movimento è generato da regole, funzioni o algoritmi", "Ogni fotogramma deve essere disegnato a mano", "Può esistere solo in 3D", "Non può dipendere dal tempo"], "ans": 0, "exp": "Nell’animazione procedurale il movimento è calcolato tramite regole o simulazioni."}, {"q": "Che cosa sono i motion graphics?", "opts": ["Solo registrazioni di oggetti reali", "L’applicazione del movimento a elementi grafici e tipografici", "Esclusivamente modelli 3D fotorealistici", "Tecniche di compressione temporale"], "ans": 1, "exp": "I motion graphics animano testi, loghi, diagrammi, icone e altri elementi grafici."}, {"q": "Che cosa si intende per kinetic typography?", "opts": ["Tipografia stampata con inchiostri metallici", "Una classificazione dei font serif", "Tipografia animata nel tempo", "Un sistema di codifica Unicode"], "ans": 2, "exp": "La kinetic typography usa movimento, scala, posizione e altre proprietà temporali del testo."}, {"q": "Nelle interfacce digitali, una funzione importante dell’animazione è:", "opts": ["Aumentare sempre il peso dei file", "Sostituire obbligatoriamente il testo", "Eliminare la gerarchia visiva", "Rendere visibili cambiamenti di stato e feedback del sistema"], "ans": 3, "exp": "L’animazione può comunicare caricamenti, conferme e transizioni di stato."}, {"q": "Quale formula rappresenta meglio un layout che dipende anche dal tempo?", "opts": ["layout = f(x,y,t)", "layout = f(RGB)", "layout = f(codec)", "layout = f(DPI)"], "ans": 0, "exp": "Con il movimento, il layout non è soltanto spaziale ma anche temporale."}, {"q": "Nel video digitale, che cosa viene campionato temporalmente?", "opts": ["Il numero di font del documento", "La realtà visiva in una successione di fotogrammi", "La profondità fisica dello schermo", "Il solo canale audio"], "ans": 1, "exp": "Una videocamera acquisisce immagini a intervalli regolari nel tempo."}, {"q": "A 25 fps, quanto dura l’intervallo tra due fotogrammi consecutivi?", "opts": ["0,4 secondi", "4 secondi", "0,04 secondi", "0,004 secondi"], "ans": 2, "exp": "L’intervallo è 1/25 di secondo, cioè 0,04 s."}, {"q": "Qual è la risoluzione comunemente associata al Full HD?", "opts": ["1280 × 720", "3840 × 2160", "4096 × 2160", "1920 × 1080"], "ans": 3, "exp": "Il Full HD corrisponde normalmente a 1920 × 1080 pixel."}, {"q": "Quale risoluzione corrisponde comunemente all’UHD 4K?", "opts": ["3840 × 2160", "2048 × 1080", "2560 × 1440", "7680 × 4320"], "ans": 0, "exp": "L’UHD 4K corrisponde normalmente a 3840 × 2160 pixel."}, {"q": "Perché la compressione è fondamentale nella distribuzione video digitale?", "opts": ["Perché i browser non visualizzano immagini", "Perché il video non compresso genera quantità molto elevate di dati", "Perché riduce sempre il frame rate a 24 fps", "Perché elimina la necessità dell’audio"], "ans": 1, "exp": "Risoluzione, bit depth e frame rate producono flussi di dati molto elevati."}, {"q": "Che cosa sfrutta principalmente la compressione spaziale?", "opts": ["Le differenze tra tracce audio", "Il movimento tra scene distanti", "Le somiglianze tra pixel all’interno dello stesso fotogramma", "La durata complessiva del video"], "ans": 2, "exp": "La ridondanza spaziale riguarda somiglianze all’interno dello stesso frame."}, {"q": "Che cosa sfrutta principalmente la compressione temporale?", "opts": ["La presenza di pixel quadrati", "Il numero di canali audio", "Il gamut cromatico", "Le somiglianze tra fotogrammi successivi"], "ans": 3, "exp": "La compressione temporale sfrutta la somiglianza tra frame vicini."}, {"q": "Che cosa significa compressione intra-frame?", "opts": ["Compressione del singolo fotogramma considerato autonomamente", "Compressione basata soltanto sull’audio", "Compressione che usa esclusivamente frame futuri", "Compressione applicabile solo alle GIF"], "ans": 0, "exp": "Nella compressione intra-frame ogni fotogramma è trattato come un’immagine indipendente."}, {"q": "Che cosa significa compressione inter-frame?", "opts": ["Compressione limitata ai sottotitoli", "Compressione che sfrutta le relazioni tra fotogrammi nel tempo", "Compressione esclusivamente vettoriale", "Compressione applicata al solo colore"], "ans": 1, "exp": "L’inter-frame coding sfrutta la ridondanza temporale."}, {"q": "Quale fra questi frame può essere decodificato senza dipendere da altri fotogrammi?", "opts": ["B-frame", "P-frame", "I-frame", "D-frame"], "ans": 2, "exp": "Un I-frame è codificato intra-frame e costituisce un’immagine indipendente."}, {"q": "Da che cosa dipende tipicamente un P-frame?", "opts": ["Solo da frame successivi", "Da una palette GIF", "Dalla traccia dei sottotitoli", "Da un fotogramma precedente usato come riferimento"], "ans": 3, "exp": "Un P-frame è predetto usando informazioni provenienti da un riferimento precedente."}, {"q": "Qual è la caratteristica distintiva di un B-frame?", "opts": ["Può utilizzare riferimenti sia precedenti sia successivi", "È sempre non compresso", "Contiene esclusivamente l’audio", "È obbligatoriamente il primo frame"], "ans": 0, "exp": "I B-frame possono usare predizione bidirezionale."}, {"q": "Che cos’è un motion vector nella compressione video?", "opts": ["Un profilo colore", "Un vettore che descrive lo spostamento stimato di una regione tra frame", "Una traccia MIDI", "Una misura della profondità colore"], "ans": 1, "exp": "I motion vector rappresentano spostamenti stimati e sono usati nella motion compensation."}, {"q": "Che cosa indica il termine codec?", "opts": ["Il contenitore fisico del file", "Una risoluzione video", "Un sistema di codifica/decodifica e spesso compressione/decompressione", "Un tipo di font per sottotitoli"], "ans": 2, "exp": "Un codec definisce come il flusso audio o video viene codificato e decodificato."}, {"q": "Quale dei seguenti è un codec video?", "opts": ["MP4", "MKV", "MOV", "H.264/AVC"], "ans": 3, "exp": "H.264/AVC è un codec; MP4, MKV e MOV sono principalmente container."}, {"q": "Quale dei seguenti è principalmente un container multimediale?", "opts": ["MP4", "AV1", "H.265/HEVC", "VP9"], "ans": 0, "exp": "MP4 è un formato contenitore capace di ospitare video, audio, sottotitoli e metadati."}, {"q": "Quale affermazione distingue correttamente codec e container?", "opts": ["Il codec organizza le tracce e il container comprime i pixel", "Il codec definisce la codifica; il container organizza i flussi", "Sono sempre sinonimi", "Il container esiste solo per l’audio"], "ans": 1, "exp": "Il codec riguarda la codifica; il container raccoglie e organizza i flussi."}, {"q": "Che cosa misura il bitrate?", "opts": ["La quantità di pixel per pollice", "Il numero di keyframe", "La quantità di dati trasmessa o memorizzata per unità di tempo", "Il numero di colori di una palette"], "ans": 2, "exp": "Il bitrate si esprime tipicamente in bit/s, kbit/s o Mbit/s."}, {"q": "Qual è la differenza principale tra CBR e VBR?", "opts": ["CBR usa solo audio e VBR solo video", "CBR è vettoriale e VBR raster", "CBR usa 8 bit e VBR 10 bit", "CBR mantiene il bitrate relativamente costante, VBR lo varia"], "ans": 3, "exp": "CBR mantiene un flusso relativamente costante; VBR lo adatta alla complessità."}, {"q": "Perché il VBR può essere più efficiente del CBR?", "opts": ["Perché assegna più dati alle scene complesse e meno a quelle semplici", "Perché elimina tutti gli I-frame", "Perché rende inutile il codec", "Perché forza sempre il 4K"], "ans": 0, "exp": "Il VBR adatta il bitrate alla complessità del contenuto."}, {"q": "Che cosa descrive il chroma subsampling?", "opts": ["L’aumento del frame rate", "La riduzione della risoluzione dell’informazione cromatica rispetto alla luminanza", "La duplicazione dei canali audio", "La conversione da video a SVG"], "ans": 1, "exp": "Il chroma subsampling riduce i campioni cromatici rispetto a quelli di luminanza."}, {"q": "Quale formato di chroma subsampling conserva più informazione cromatica?", "opts": ["4:2:0", "4:2:2", "4:4:4", "4:1:0"], "ans": 2, "exp": "4:4:4 conserva la risoluzione cromatica completa."}, {"q": "Con una profondità di 8 bit per componente, quanti livelli sono disponibili per ciascun canale?", "opts": ["128", "512", "1024", "256"], "ans": 3, "exp": "Con 8 bit si rappresentano 2^8 = 256 valori."}, {"q": "Con una profondità di 10 bit per componente, quanti livelli sono disponibili per ciascun canale?", "opts": ["1024", "256", "512", "2048"], "ans": 0, "exp": "Con 10 bit si rappresentano 2^10 = 1024 livelli."}, {"q": "Qual è un vantaggio tipico di una maggiore bit depth nel video?", "opts": ["Frame rate sempre più alto", "Transizioni tonali più graduali e maggiore margine in post-produzione", "Risoluzione spaziale automaticamente maggiore", "File sempre più piccoli"], "ans": 1, "exp": "Una maggiore profondità riduce il rischio di banding e aumenta la precisione tonale."}, {"q": "Che cosa significa HDR in ambito video?", "opts": ["High Data Rotation", "Hybrid Digital Raster", "High Dynamic Range", "Horizontal Display Rate"], "ans": 2, "exp": "HDR significa High Dynamic Range."}, {"q": "Quale fase del workflow video riguarda la regolazione tecnica di esposizione e bilanciamento cromatico?", "opts": ["Motion estimation", "Rasterizzazione", "Sottocampionamento audio", "Color correction"], "ans": 3, "exp": "La color correction corregge e uniforma tecnicamente esposizione e colore."}, {"q": "Quale fase del workflow video mira soprattutto a costruire un look cromatico espressivo?", "opts": ["Color grading", "Frame interpolation", "Bitrate locking", "Packet routing"], "ans": 0, "exp": "Il color grading costruisce l’aspetto estetico e narrativo del colore."}, {"q": "Che cosa caratterizza il montaggio non lineare digitale (NLE)?", "opts": ["L’obbligo di tagliare fisicamente la pellicola", "La possibilità di accedere e montare le clip senza seguire l’ordine fisico del supporto", "L’assenza di timeline", "L’impossibilità di modificare l’audio"], "ans": 1, "exp": "Nel NLE le clip possono essere selezionate e disposte liberamente."}, {"q": "Che cosa significa editing non distruttivo?", "opts": ["Il video non viene mai compresso", "Non è possibile eliminare clip", "Le modifiche sono registrate come istruzioni senza alterare necessariamente il file sorgente", "Si lavora solo su supporti ottici"], "ans": 2, "exp": "Il montaggio non distruttivo conserva i media originali."}, {"q": "Nel montaggio video, a che cosa serve la timeline?", "opts": ["A convertire automaticamente raster in vettori", "A misurare il gamut del monitor", "A creare profili ICC", "A organizzare clip e altri elementi lungo l’asse temporale"], "ans": 3, "exp": "La timeline organizza video, audio, testi ed effetti nel tempo."}, {"q": "Perché la timeline può essere considerata una forma di impaginazione temporale?", "opts": ["Perché dispone gli elementi in relazione al tempo, come il layout li dispone nello spazio", "Perché sostituisce completamente le coordinate x e y", "Perché elimina ogni gerarchia editoriale", "Perché contiene solo testo"], "ans": 0, "exp": "La pagina organizza nello spazio; la timeline aggiunge ordine e durata temporale."}, {"q": "Qual è la differenza concettuale fra download e streaming?", "opts": ["Lo streaming funziona solo senza Internet", "Nel download il file viene trasferito; nello streaming può essere riprodotto mentre arriva", "Il download richiede sempre H.265", "Lo streaming non usa compressione"], "ans": 1, "exp": "Lo streaming consente la riproduzione progressiva dei dati."}, {"q": "Che cosa fa l’Adaptive Bitrate Streaming?", "opts": ["Mantiene sempre il bitrate massimo", "Disattiva automaticamente l’audio", "Adatta dinamicamente la qualità del flusso alle condizioni di rete e al dispositivo", "Converte il video in GIF"], "ans": 2, "exp": "L’ABR passa tra rappresentazioni diverse per mantenere fluida la riproduzione."}, {"q": "Quale combinazione descrive meglio un prodotto editoriale multimediale contemporaneo?", "opts": ["Solo testo e immagini statiche", "Solo video non compresso", "Solo contenuti vettoriali", "Testo, immagini, audio, video, animazioni e interattività"], "ans": 3, "exp": "L’editoria elettronica può integrare molteplici linguaggi e media."}, {"q": "Quale principio di accessibilità è appropriato per un video editoriale?", "opts": ["Fornire sottotitoli e, quando necessario, trascrizioni o audiodescrizioni", "Eliminare sempre i controlli di riproduzione", "Imporre l’autoplay con audio", "Usare lampeggiamenti rapidi"], "ans": 0, "exp": "Sottotitoli, trascrizioni, audiodescrizioni e controlli accessibili ampliano la fruibilità."}, {"q": "Qual è lo scopo della preferenza CSS prefers-reduced-motion?", "opts": ["Aumentare automaticamente la risoluzione", "Permettere di ridurre animazioni e movimenti per gli utenti che lo richiedono", "Forzare il video a 60 fps", "Attivare il profilo colore del monitor"], "ans": 1, "exp": "prefers-reduced-motion consente di rispettare la preferenza dell’utente per meno movimento."}], letters=["A","B","C","D"];
const quiz=document.getElementById("quiz"),pt=document.getElementById("pt"),pb=document.getElementById("pb");
function draw(){
 questions.forEach((q,i)=>{
  const c=document.createElement("section"); c.className="card"; c.dataset.i=i;
  c.innerHTML=`<div class="qn">Domanda ${i+1}</div><div class="question">${q.q}</div>
  <div class="options">${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span><b>${letters[j]}.</b> ${o}</span></label>`).join("")}</div>
  <button class="check" data-i="${i}">Valida risposta</button><div class="feedback" id="f${i}"></div>`;
  quiz.appendChild(c);
 });
 document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=e=>{e.target.closest(".options").querySelectorAll(".option").forEach(l=>l.classList.remove("selected"));e.target.closest(".option").classList.add("selected");progress()});
 document.querySelectorAll(".check").forEach(b=>b.onclick=()=>validate(+b.dataset.i));
}
function progress(){let n=questions.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;pt.textContent=`${n} / ${questions.length}`;pb.style.width=`${n/questions.length*100}%`}
function validate(i){
 const s=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById("f"+i),c=document.querySelector(`.card[data-i="${i}"]`),labs=c.querySelectorAll(".option");
 labs.forEach(l=>l.classList.remove("correct","incorrect"));
 if(!s){f.className="feedback show bad";f.textContent="Seleziona una risposta prima di validare.";return false}
 const chosen=+s.value,correct=questions[i].ans;labs[correct].classList.add("correct");if(chosen!==correct)labs[chosen].classList.add("incorrect");
 f.className="feedback show "+(chosen===correct?"ok":"bad");f.innerHTML=`<b>${chosen===correct?"Risposta corretta.":"Risposta non corretta."}</b> ${questions[i].exp}`;return chosen===correct;
}
document.getElementById("all").onclick=()=>{
 let s=0;questions.forEach((_,i)=>{if(validate(i))s++});const pct=Math.round(s/questions.length*100);
 document.getElementById("score").textContent=`${s} / ${questions.length}`;
 document.getElementById("comment").textContent=pct>=90?`${pct}% — Padronanza eccellente.`:pct>=75?`${pct}% — Preparazione molto buona.`:pct>=60?`${pct}% — Preparazione sufficiente, con alcuni punti da ripassare.`:`${pct}% — È consigliato un ripasso dei concetti fondamentali.`;
 const r=document.getElementById("result");r.classList.add("show");r.scrollIntoView({behavior:"smooth",block:"center"});
};
document.getElementById("reset").onclick=()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll(".option").forEach(l=>l.classList.remove("selected","correct","incorrect"));document.querySelectorAll(".feedback").forEach(f=>{f.className="feedback";f.textContent=""});document.getElementById("result").classList.remove("show");progress();scrollTo({top:0,behavior:"smooth"})};
draw();progress();
</script>
</body></html>
